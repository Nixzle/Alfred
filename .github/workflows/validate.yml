name: Validate Alfred
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public package
        run: python scripts/validate.py
      - name: Test launcher isolation
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Diff hygiene
        shell: bash
        run: git diff --check
